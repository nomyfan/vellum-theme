<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme Sample</title>
    <link rel="stylesheet" href="sample.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 data-role="title">Theme Preview</h1>
      <nav>
        <a href="#main">Main</a>
        <a href="#footer" aria-disabled="true">Footer</a>
      </nav>
    </header>

    <main id="main">
      <section class="card" data-state="active">
        <h2>Buttons</h2>
        <button type="button">Primary</button>
        <button type="button" disabled>Disabled</button>
      </section>

      <section class="card">
        <h2>Form</h2>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Ada" />
      </section>
    </main>

    <footer id="footer">&copy; 2025 Theme Lab</footer>
  </body>
</html>
